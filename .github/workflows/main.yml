name: Frame photos
on:
  workflow_dispatch:
jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python frame.py
      - uses: actions/upload-artifact@v4
        with:
          name: framed-photos
          path: framed/
